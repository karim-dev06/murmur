  <script>
    const tl = gsap.timeline({ paused: true });

    // Seeded random, so every render is identical.
    let seed = 7;
    const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

    // Window arrives.

    // Caret blinks until the text lands.
    tl.fromTo("#demo-caret1", { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "steps(1)", repeat: 19, yoyo: true }, 0.4);

    // Caption and key.
    tl.fromTo("#demo-caption1", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 0.6);
    tl.fromTo("#demo-key", { y: 0, boxShadow: "0 10px 0 #d6d0c8, 0 18px 30px rgba(60,40,20,0.18)" },
      { y: 8, boxShadow: "0 2px 0 #d6d0c8, 0 6px 12px rgba(60,40,20,0.14)", background: "linear-gradient(180deg,#f3efe9,#e7e2db)", duration: 0.12, ease: "power2.out" }, 1.2);

    // Murmur shows up once the press is clearly a hold.
    tl.fromTo("#demo-pill-small-in", { opacity: 0, y: 24, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "expo.out" }, 1.5);
    tl.fromTo("#demo-pill-big-in", { opacity: 0, scaleY: 0.55, scaleX: 0.5, filter: "blur(10px)" },
      { opacity: 1, scaleY: 1, scaleX: 1, filter: "blur(0px)", duration: 0.25, ease: "power3.out", transformOrigin: "50% 100%" }, 2.1);

    // Level bars move with the voice.
    function bars(selector, start, end) {
      document.querySelectorAll(selector + " i").forEach((bar) => {
        const frames = [];
        for (let t = start; t < end; t += 0.1) frames.push({ scaleY: 0.12 + rand() * 0.88, duration: 0.1, ease: "none" });
        frames.push({ scaleY: 0.12, duration: 0.15 });
        tl.fromTo(bar, { scaleY: 0.12 }, { keyframes: frames }, start);
      });
    }
    bars("#demo-bars-small", 1.6, 2.2);
    bars("#demo-bars-big", 2.1, 8.8);

    // Words appear as they are spoken, a little behind the voice.
    const wordTimes = [2.3, 2.6, 2.95, 3.2, 3.45, 3.75, 3.95, 4.3, 4.55, 5.25, 5.55, 6.0, 6.55, 6.8, 7.15, 7.4, 7.6, 7.85];
    wordTimes.forEach((t, i) => {
      tl.fromTo("#dw" + i, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out" }, t);
    });

    // Let go.
    tl.to("#demo-key", { y: 0, boxShadow: "0 10px 0 #d6d0c8, 0 18px 30px rgba(60,40,20,0.18)", background: "linear-gradient(180deg,#ffffff,#f1efec)", duration: 0.12, ease: "power2.out" }, 8.75);
    tl.to("#demo-caption1", { opacity: 0, filter: "blur(8px)", duration: 0.15 }, 8.75);
    tl.fromTo("#demo-caption2", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 8.85);
    tl.to("#demo-status-listen", { opacity: 0, duration: 0.15 }, 8.85);
    tl.fromTo("#demo-status-work", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 8.9);
    tl.to("#demo-live", { opacity: 0.55, duration: 0.2 }, 8.9);
    tl.fromTo("#demo-spinner", { rotation: 0 }, { rotation: 360 * 2, duration: 0.9, ease: "none" }, 8.9);

    // Typed for you, already tidy.
    tl.to("#demo-pill-big-in", { opacity: 0, y: 30, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, 9.55);
    tl.to("#demo-key", { opacity: 0, duration: 0.2 }, 9.55);
    tl.to("#demo-caption2", { opacity: 0, duration: 0.2 }, 9.55);
    tl.fromTo("#demo-typed", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, 9.8);
    tl.fromTo("#demo-caret2", { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "steps(1)", repeat: 8, yoyo: true }, 10.2);
    tl.fromTo("#demo-hl-wed", { backgroundSize: "0% 100%" }, { backgroundSize: "100% 100%", duration: 0.35, ease: "power2.out" }, 10.5);
    tl.fromTo("#demo-hl-readme", { backgroundSize: "0% 100%" }, { backgroundSize: "100% 100%", duration: 0.35, ease: "power2.out" }, 10.8);
    ["#demo-chip1", "#demo-chip2", "#demo-chip3"].forEach((chip, i) => {
      tl.fromTo(chip, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 10.45 + i * 0.3);
    });
